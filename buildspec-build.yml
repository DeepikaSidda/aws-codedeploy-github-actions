version: 0.2
env:
  exported-variables:
    - IMAGE_TAG
phases:
  install:
    runtime-versions:
      docker: 19
    commands:
      - echo "Installing AWS CLI..."
      - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      - unzip awscliv2.zip
      - ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
      - rm -rf awscliv2.zip aws/
      - which aws # Verify aws cli is in path
  build:
    commands:
      # ECR_REPOSITORY and AWS_ACCOUNT_ID are passed as environment variables from CodeBuild Project definition.
      # AWS_REGION is set by CodeBuild environment.
      - AWS_REGION=us-east-1
      - echo "Authenticating with ECR in region: us-east-1..."
      -  | docker login --username AWS --password-stdin 381492198534.dkr.ecr.us-east-1.amazonaws.com

      - IMAGE_TAG= # Use the commit hash as the image tag
      - echo "Building and pushing Docker image: :"
      - docker build -t :latest .
      - docker tag :latest 381492198534.dkr.ecr.us-east-1.amazonaws.com/:
      - docker tag :latest 381492198534.dkr.ecr.us-east-1.amazonaws.com/:latest # Also tag with latest

      - docker push 381492198534.dkr.ecr.us-east-1.amazonaws.com/:
      - docker push 381492198534.dkr.ecr.us-east-1.amazonaws.com/:latest

      - echo "IMAGE_TAG=" >>  # Export IMAGE_TAG for CodePipeline
