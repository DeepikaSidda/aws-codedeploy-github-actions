version: 0.2
env:
  exported-variables:
   - APP_URL
phases:
  build:
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-region: ap-south-1

    - name: Install kubectl
      uses: alexellis/arkade-get@v1
      with:
        kubectl: latest

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name eks-east --region ap-south-1

    - name: Deploy Helm
      uses: bitovi/github-actions-deploy-eks-helm@v1.2.7
      with:
        aws-region: ap-south-1
        cluster-name: eks-south
        config-files: demo-app/values.yaml
        chart-path: demo-app/
        values: image.repository=${{ env.IMAGE_REPO }},image.tag=${{ env.IMAGE_TAG }}
        namespace: default
        name: demo-app

    - name: Get Ingress URL
      run: |
        while :; do
          url=$(kubectl get ingress/demo-app-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' -n default)
          [ -z "$url" ] && echo "Waiting..." && sleep 5 || break
        done
        echo "APP_URL=$url" >> $GITHUB_ENV
