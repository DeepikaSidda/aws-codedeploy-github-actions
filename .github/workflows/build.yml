name: Build and Push to ECR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubOIDCRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Node App
        env:
          IMAGE_TAG: ${{ github.sha }}
          NODE_REPO: ${{ secrets.ECR_REPO_URI_NODE }}
        run: |
          docker build -t $NODE_REPO:$IMAGE_TAG ./node-app
          docker push $NODE_REPO:$IMAGE_TAG

      - name: Build and Push NGINX Proxy
        env:
          IMAGE_TAG: ${{ github.sha }}
          NGINX_REPO: ${{ secrets.ECR_REPO_URI_NGINX }}
        run: |
          docker build -t $NGINX_REPO:$IMAGE_TAG ./nginx
          docker push $NGINX_REPO:$IMAGE_TAG
